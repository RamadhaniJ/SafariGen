# Runs automatically on every pull request and every push to main.
# A red X on a pull request means something below failed: open "Details" to see what.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway values for the test run only. Real secrets never go here.
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Every model change has a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        # Listed explicitly: a plain "manage.py test" still trips over the
        # stray Itinerary/test.py file (review issue 8).
        run: python manage.py test backend Users Itinerary.tests Itinerary.tests_pdf_cache Itinerary.tests_price_preview

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
