{% extends "admin/base_site.html" %}

{% block content %}
<div style="padding: 20px; max-width: 1000px; margin: 0 auto;">
    
    <div style="margin-bottom: 25px;">
        <a href="{% url 'admin:Accommodation_accommodation_change' accommodation.id %}" class="button" style="background: var(--color-primary-600); color: white; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-weight: bold;">
            ← Rudi kwa {{ accommodation.name }}
        </a>
        <h1 class="text-font-important-light dark:text-font-important-dark" style="margin-top: 20px; font-size: 24px;">
            📸 Bulk Image Upload: <span style="color: var(--color-primary-600);">{{ accommodation.name }}</span>
        </h1>
    </div>

    <!-- Tag Selection -->
    <div style="background: #fff; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
        <label for="image-tag-select" style="font-weight: bold; color: #333; font-size: 15px;">Chagua Tag ya Picha:</label>
        <select id="image-tag-select" style="padding: 8px 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;">
            {% for tag_code, tag_label in tag_choices %}
                <option value="{{ tag_code }}">{{ tag_label }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Form ya Dropzone -->
    <form action="{% url 'admin:accommodation-bulk-upload-images' accommodation.id %}" method="post" enctype="multipart/form-data" class="dropzone" id="accommodation-dropzone" style="border: 2px dashed var(--color-primary-600); border-radius: 12px; background: #f8fafc; padding: 40px; text-align: center; cursor: pointer;">
        {% csrf_token %}
        <div class="dz-message">
            <div style="font-size: 48px; margin-bottom: 10px;">🖼️</div>
            <h2 style="font-size: 20px; color: #2c3e50; margin-bottom: 8px;">Buruza (Drag) picha hapa au BONYEZA HAPA kuchagua</h2>
            <p style="color: #7f8c8d; font-size: 13px;">Unaruhusiwa ku-upload picha nyingi mara moja</p>
        </div>
    </form>

</div>

<link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>

<script>
    // Zima autoDiscover ili kuzuia Dropzone isijianzishe mara mbili
    Dropzone.autoDiscover = false;

    document.addEventListener("DOMContentLoaded", function () {
        var uploadUrl = "{% url 'admin:accommodation-bulk-upload-images' accommodation.id %}";

        var myDropzone = new Dropzone("#accommodation-dropzone", {
            url: uploadUrl, // Ni lazima URL ielezwe hapa wazi kuzuia 'No URL provided' error!
            paramName: "images", // Lazima ilingane na field jina kwenye model (images)
            maxFilesize: 15, // MB
            acceptedFiles: "image/*",
            parallelUploads: 5,
            timeout: 180000,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            },
            init: function() {
                this.on("sending", function(file, xhr, formData) {
                    var selectedTag = document.getElementById("image-tag-select").value;
                    formData.append("tag", selectedTag);
                });

                this.on("success", function(file, response) {
                    console.log("Picha imehifadhiwa:", response);
                });

                this.on("error", function(file, response) {
                    console.error("Kuna tatizo wakati wa upload:", response);
                });
            }
        });
    });
</script>
{% endblock %}
